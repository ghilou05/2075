<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2075</title>
    <style>
      body { margin: 0; background: #111; }
      #stage { position: relative; width: 1280px; height: 720px; }
      #mirror { position: absolute; inset: 0; transform: scaleX(-1); }
      #mirror video, #mirror canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #debug { position: absolute; top: 8px; left: 8px; color: #0f0; font: 14px monospace; margin: 0; }
    </style>
  </head>

  <body>
    <div id="stage">
      <div id="mirror">
        <video id="cam" playsinline muted></video>
        <canvas id="skeleton"></canvas>
      </div>
      <!-- Person B's Three.js canvas goes here, un-mirrored -->
      <div id="hud"></div>
      <pre id="debug"></pre>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
